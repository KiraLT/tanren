packages:
  - apps/*
  - packages/*

# One version per shared dependency; packages reference it as "catalog:".
# Exact pins on purpose: an upgrade is a deliberate one-line change (ADR-0003, ADR-0004).
catalog:
  "@biomejs/biome": 2.5.15
  "@cloudflare/vitest-plugin": 1.4.6
  "@cloudflare/workers-types": 5.20261019.1
  "@effect/sql-d1": 4.0.5
  "@effect/vitest": 4.0.5
  "@expo/metro-runtime": 58.0.15
  "@modelcontextprotocol/server": 2.3.1
  "@types/node": 24.19.2
  "@types/react": 19.3.0
  agents: 0.28.1
  better-auth: 1.7.11
  drizzle-kit: 0.31.11
  drizzle-orm: 0.45.4
  effect: 4.0.5
  expo: 58.0.19
  expo-audio: 58.0.10
  expo-constants: 58.0.13
  expo-crypto: 58.0.7
  expo-font: 58.0.10
  expo-haptics: 58.0.7
  expo-keep-awake: 58.0.3
  expo-linking: 58.0.14
  expo-notifications: 58.1.6
  expo-router: 58.0.26
  expo-secure-store: 58.0.2
  expo-sqlite: 58.0.14
  expo-status-bar: 58.0.4
  jose: 6.2.12
  react: 19.3.0
  react-dom: 19.3.0
  react-native: 0.88.0
  react-native-safe-area-context: 5.10.1
  react-native-screens: 4.30.0
  react-native-svg: 15.16.0
  react-native-web: 0.21.4
  sharp: 0.35.5
  tsx: 4.23.15
  typescript: 7.0.2
  uqr: 0.1.3
  vite: 8.3.4
  vitest: 5.0.5
  wrangler: 4.151.2

# Native postinstall scripts we allow (wrangler's workerd, drizzle-kit's esbuild).
allowBuilds:
  core-js-pure: false
  esbuild: true
  workerd: true

minimumReleaseAgeExclude:
  - "@cloudflare/vitest-plugin@1.4.6"
  - miniflare@5.20261019.1-beta
  - wrangler@4.151.3
