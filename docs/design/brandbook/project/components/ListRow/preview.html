<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>ListRow — preview</title>
<style>
html,body{margin:0} body{background:var(--bg);color:var(--text);font-family:var(--font-text);padding:16px}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-full);padding:0 var(--space-xl);min-width:44px;border:0;cursor:pointer}
.pill svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-lg);border:var(--stroke-hairline) solid var(--border)}
[data-theme="dark"] .card{border-color:transparent}
.group{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-xs) 0;overflow:hidden;max-width:358px}
.lrow{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-lg);min-height:52px;box-sizing:border-box}
.sep{height:var(--stroke-hairline);background:var(--border)}
.disc{width:24px;height:24px;border-radius:var(--radius-full);display:inline-flex;align-items:center;justify-content:center;flex:none;font:600 13px/1 var(--font-text)}
.muted{color:var(--text-muted)}

</style></head><body>

<div class="group">
<div class="lrow"><span class="disc" style="background:var(--success);color:var(--bg)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M20 6L9 17l-5-5"/></svg></span><div style="flex:1"><div class="headline">Back Squat</div><div class="subhead muted">3 x 5</div></div><span class="subhead muted" style="font-variant-numeric:tabular-nums">100 kg x 5</span></div>
<div class="sep" style="margin-left:52px"></div>
<div class="lrow" style="background:var(--accent-soft)"><span class="disc" style="background:var(--accent);color:var(--on-accent)">2</span><div style="flex:1"><div class="headline">Romanian Deadlift</div><div class="subhead muted">3 x 8</div></div><span class="subhead" style="font-variant-numeric:tabular-nums">80 kg x 8</span></div>
<div class="sep" style="margin-left:52px"></div>
<div class="lrow"><span class="disc muted" style="border:1.5px solid var(--border);box-sizing:border-box">3</span><div style="flex:1"><div class="headline">Leg Press</div></div></div>
</div>
<div class="group" style="margin-top:24px">
<div class="lrow"><span class="muted" style="display:flex"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M20 10c0 6-8 12-8 12s-8-6-8-12a8 8 0 0 1 16 0zM12 13a3 3 0 1 0 0-6 3 3 0 0 0 0 6z"/></svg></span><div style="flex:1"><div class="headline">Gym</div><div class="subhead muted">12 equipment items</div></div><span class="muted" style="display:flex"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 18l6-6-6-6"/></svg></span></div>
<div class="sep" style="margin-left:48px"></div>
<div class="lrow" style="color:var(--danger)"><span style="display:flex"><svg viewBox="0 0 24 24" width="20" height="20" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M9 21H5a2 2 0 0 1-2-2V5a2 2 0 0 1 2-2h4M16 17l5-5-5-5M21 12H9"/></svg></span><div class="headline" style="flex:1">Sign out</div></div>
</div>
</body></html>
