<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>SetDots — preview</title>
<style>
html,body{margin:0} body{background:var(--bg);color:var(--text);font-family:var(--font-text);padding:16px}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-full);padding:0 var(--space-xl);min-width:44px;border:0;cursor:pointer}
.pill svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-lg);border:var(--stroke-hairline) solid var(--border)}
[data-theme="dark"] .card{border-color:transparent}
.group{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-xs) 0;overflow:hidden;max-width:358px}
.lrow{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-lg);min-height:52px;box-sizing:border-box}
.sep{height:var(--stroke-hairline);background:var(--border)}
.disc{width:24px;height:24px;border-radius:var(--radius-full);display:inline-flex;align-items:center;justify-content:center;flex:none;font:600 13px/1 var(--font-text)}
.muted{color:var(--text-muted)}

</style></head><body>

<div class="row" style="gap:32px">
<div style="display:flex;gap:4px;align-items:center"><span style="display:inline-block;width:10px;height:6px;border-radius:3px;background:var(--text-muted)"></span><span style="display:inline-block;width:10px;height:6px;border-radius:3px;background:var(--text-muted)"></span><span style="display:inline-block;width:16px;height:6px;border-radius:3px;background:var(--accent)"></span><span style="display:inline-block;width:10px;height:6px;border-radius:3px;background:var(--border)"></span><span style="display:inline-block;width:10px;height:6px;border-radius:3px;background:var(--border)"></span><span class="subhead muted" style="margin-left:8px">Set 3 of 5</span></div>
<div style="display:flex;gap:6px;align-items:center"><span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--success)"></span><span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--success)"></span><span style="display:inline-block;width:16px;height:8px;border-radius:999px;background:var(--accent)"></span><span style="display:inline-block;width:8px;height:8px;border-radius:999px;background:var(--border)"></span></div>
</div>
</body></html>
