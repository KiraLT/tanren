<!doctype html>
<html lang="en"><head><meta charset="utf-8"><title>StatusPill — preview</title>
<style>
html,body{margin:0} body{background:var(--bg);color:var(--text);font-family:var(--font-text);padding:16px}
.row{display:flex;align-items:center;gap:16px;flex-wrap:wrap}
.pill{display:inline-flex;align-items:center;justify-content:center;gap:8px;border-radius:var(--radius-full);padding:0 var(--space-xl);min-width:44px;border:0;cursor:pointer}
.pill svg{width:24px;height:24px;stroke:currentColor;fill:none;stroke-width:2;stroke-linecap:round;stroke-linejoin:round}
.card{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-lg);border:var(--stroke-hairline) solid var(--border)}
[data-theme="dark"] .card{border-color:transparent}
.group{background:var(--surface);border-radius:var(--radius-lg);padding:var(--space-xs) 0;overflow:hidden;max-width:358px}
.lrow{display:flex;align-items:center;gap:var(--space-md);padding:var(--space-sm) var(--space-lg);min-height:52px;box-sizing:border-box}
.sep{height:var(--stroke-hairline);background:var(--border)}
.disc{width:24px;height:24px;border-radius:var(--radius-full);display:inline-flex;align-items:center;justify-content:center;flex:none;font:600 13px/1 var(--font-text)}
.muted{color:var(--text-muted)}

</style></head><body>

<div class="row">
<span class="pill caption" style="height:24px;padding:0 8px;background:var(--surface);color:var(--success)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M20 6L9 17l-5-5"/></svg>Available at Home</span>
<span class="pill caption" style="height:24px;padding:0 8px;background:var(--surface);color:var(--accent)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M13 2L3 14h9l-1 8 10-12h-9l1-8z"/></svg>Today</span>
<span class="pill caption" style="height:24px;padding:0 8px;background:var(--surface);color:var(--text-muted)">Upcoming</span>
<span class="pill caption" style="height:24px;padding:0 8px;background:var(--surface);color:var(--danger)"><svg viewBox="0 0 24 24" width="16" height="16" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round" ><path d="M10.3 3.9L2.4 18a2 2 0 0 0 1.7 3h15.8a2 2 0 0 0 1.7-3L13.7 3.9a2 2 0 0 0-3.4 0zM12 9v4M12 17h.01"/></svg>Missed</span>
</div>
</body></html>
