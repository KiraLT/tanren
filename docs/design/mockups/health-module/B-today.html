<!doctype html><html><head><meta charset="utf-8"><meta name="viewport" content="width=device-width"><title>HM-B Today</title><link rel="stylesheet" href="base.css"></head><body><script src="rings.js"></script>
<div class="page"><div class="appbar"><h1>Today</h1><span class="caption">Tue 27 Oct</span></div><div id="root"></div></div>
<script>
const bar=(l,v,p,c,r)=>`<div style="margin-top:12px"><div style="display:flex;justify-content:space-between;align-items:baseline"><span class="label">${l}</span><span class="headline">${v}<span class="caption"> ${r}</span></span></div><div class="bar"><i style="width:${Math.min(100,p*100)}%;background:var(${c})"></i></div></div>`;
const wide=document.documentElement.classList.contains('wide');const gw=wide?240:200;
const mod=`<div class="card" aria-label="Health today: 1,650 kcal left of 3,070; eaten 1,420; burned 1,840; protein 96 of 155 g">
<div style="position:relative;width:${gw}px;margin:0 auto">${gauge(gw,12,1420/3070,'--accent','Eaten 46 percent of budget')}<div style="position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;padding-top:${gw*0.12}px"><div class="numeral" style="font-size:${wide?72:56}px;line-height:1">1,650</div><div class="label">kcal left</div></div></div>
${bar('Eaten','1,420',1420/3070,'--accent','/ 3,070')}${bar('Protein','96',96/155,'--success','/ 155 g')}${bar('Burned','1,840',1840/3070,'--muted','kcal · as of 14:05')}
<div class="caption" style="margin-top:12px">8,420 steps · 52 bpm resting</div></div>`;
const sess=`<div class="ph"><div class="t">Lower A</div>5 exercises · Back squat 100 kg × 5 · planned session (unchanged)</div>`;
document.getElementById('root').innerHTML=wide?`<div class="cols"><div>${sess}</div><div style="margin-top:16px">${mod}</div></div>`:mod+sess;
</script></body></html>
