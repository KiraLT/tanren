<!doctype html>
<!-- biome-ignore lint/a11y/useValidLang: %LANG_ISO_CODE% is the Expo template placeholder, replaced at export -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16181D" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1113" />
    <!-- Social preview (BRAND-2b): og.png is the W1 lockup on graphite, 1200x630; the description is the landing headline. -->
    <meta property="og:title" content="Tanren" />
    <meta property="og:description" content="Log the set. Forge the habit." />
    <meta property="og:image" content="https://tanren.me/og.png" />
    <meta property="og:image:width" content="1200" />
    <meta property="og:image:height" content="630" />
    <meta property="og:url" content="https://tanren.me/" />
    <meta property="og:type" content="website" />
    <meta name="twitter:card" content="summary_large_image" />
    <!-- Forge `bg` (src/ui/colors.ts light/dark) so there is no white frame before React mounts. -->
    <style>
      html,
      body {
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f1113;
        }
      }
      html[data-theme="light"],
      html[data-theme="light"] body {
        background: #ffffff;
      }
      html[data-theme="dark"],
      html[data-theme="dark"] body {
        background: #0f1113;
      }
    </style>
    <!-- The app's stored theme (localStorage "tanren.theme" = "system" | "light" | "dark",
         src/ui/themePreferenceStore.web.ts) can differ from the OS scheme: mark it on <html> before
         React mounts so a reload never paints the other scheme's bg first. "system", absent or
         blocked storage leaves the media query above in charge. -->
    <script>
      try {
        const stored = localStorage.getItem("tanren.theme");
        if (stored === "light" || stored === "dark") {
          document.documentElement.setAttribute("data-theme", stored);
        }
      } catch {
        // Storage blocked (private mode): the media query decides.
      }
    </script>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
