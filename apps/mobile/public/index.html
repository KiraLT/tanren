<!doctype html>
<!-- biome-ignore lint/a11y/useValidLang: %LANG_ISO_CODE% is the Expo template placeholder, replaced at export -->
<html lang="%LANG_ISO_CODE%">
  <head>
    <meta charset="utf-8" />
    <meta http-equiv="X-UA-Compatible" content="IE=edge" />
    <meta name="viewport" content="width=device-width, initial-scale=1, shrink-to-fit=no" />
    <title>%WEB_TITLE%</title>
    <link rel="manifest" href="/manifest.json" />
    <meta name="theme-color" content="#16181D" />
    <meta name="theme-color" media="(prefers-color-scheme: dark)" content="#0F1113" />
    <!-- Forge `bg` (src/ui/colors.ts light/dark) so there is no white frame before React mounts. -->
    <style>
      html,
      body {
        background: #ffffff;
      }
      @media (prefers-color-scheme: dark) {
        html,
        body {
          background: #0f1113;
        }
      }
    </style>
    <link rel="icon" href="/icons/icon-192.png" type="image/png" />
    <link rel="apple-touch-icon" href="/icons/apple-touch-180.png" />
    <meta name="apple-mobile-web-app-capable" content="yes" />
    <!-- The `react-native-web` recommended style reset: https://necolas.github.io/react-native-web/docs/setup/#root-element -->
    <style id="expo-reset">
      /* These styles make the body full-height */
      html,
      body {
        height: 100%;
      }
      /* These styles disable body scrolling if you are using <ScrollView> */
      body {
        overflow: hidden;
      }
      /* These styles make the root element full-height */
      #root {
        display: flex;
        height: 100%;
        flex: 1;
      }
    </style>
  </head>

  <body>
    <!-- Use static rendering with Expo Router to support running without JavaScript. -->
    <noscript> You need to enable JavaScript to run this app. </noscript>
    <!-- The root element for your Expo app. -->
    <div id="root"></div>
  </body>
</html>
